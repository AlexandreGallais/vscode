# Native binaries (esbuild, rollup, lmdb, unrs-resolver…) for every platform in one node_modules:
# the same folder works on macOS, in the devcontainer and on Linux machines, and can be deleted freely.
supportedArchitectures:
  os: [darwin, linux]
  cpu: [arm64, x64]
  libc: [glibc]

# No install scripts: they would rebuild binaries for the installing machine only.
# The prebuilt binaries above cover every platform.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false
